version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: asian_eye_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localpassword123
      POSTGRES_DB: asian_eye_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: asian_eye_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@asianeyehospital.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
